services:
  db:
    image: postgis/postgis:16-3.4
    container_name: mapreport-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mapreport
      POSTGRES_PASSWORD: mapreport_dev_pw
      POSTGRES_DB: mapreport
    ports:
      - "5433:5432"   # host:container — using 5433 to avoid conflict
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: